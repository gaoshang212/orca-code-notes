name: Release VSIX

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      marketplace_tag:
        description: 'Publish an existing GitHub Release to Marketplace (leave empty for a build only)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: vsix-${{ inputs.marketplace_tag && format('refs/tags/{0}', inputs.marketplace_tag) || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    if: (github.event_name == 'workflow_dispatch' && !inputs.marketplace_tag) || (github.event_name == 'push' && !github.event.deleted)
    runs-on: windows-2022
    outputs:
      asset: ${{ steps.stage.outputs.asset }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0
      - name: Build Release VSIX
        run: msbuild VsOrcaNotes.sln -restore -p:Configuration=Release -v:minimal -nologo
      - name: Test localized UI and outgoing notes
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/Localization.ps1
      - name: Check manifest and stage VSIX
        id: stage
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./.github/scripts/Stage-Vsix.ps1 -Tag $env:TAG
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: vsix
          path: dist/${{ steps.stage.outputs.asset }}
          if-no-files-found: error
          overwrite: true

  github-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: vsix
      - name: Publish versioned installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          if ! gh release view "$TAG" --json isDraft,assets > release.json; then
            gh release create "$TAG" "$ASSET" --verify-tag --title "Orca Code Notes $TAG" --generate-notes
          elif jq -e '.isDraft' release.json > /dev/null; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --draft=false
          else
            digest="sha256:$(sha256sum "$ASSET" | cut -d' ' -f1)"
            jq -e --arg name "$ASSET" --arg digest "$digest" \
              'any(.assets[]; .name == $name and .digest == $digest)' release.json > /dev/null || {
                echo "::error::The published release does not contain the matching VSIX."
                exit 1
              }
          fi

  marketplace:
    name: Publish Visual Studio Marketplace
    needs: github-release
    if: >-
      !cancelled() &&
      (needs.github-release.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.marketplace_tag != ''))
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download and verify published installer
        id: installer
        env:
          TAG: ${{ inputs.marketplace_tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:TAG -cnotmatch '^v([0-9]+(?:\.[0-9]+){1,3})$') { throw 'Expected a numeric VSIX version tag such as v0.1.9.' }
          $asset = "OrcaNotes-$($Matches[1]).vsix"
          $release = gh release view $env:TAG --json tagName,isDraft,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.isDraft -or $release.tagName -cne $env:TAG) { throw 'A published release is required.' }
          $expected = ($release.assets | Where-Object name -CEQ $asset).digest
          gh release download $env:TAG --pattern $asset --dir "$env:RUNNER_TEMP/package"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $payload = Join-Path "$env:RUNNER_TEMP/package" $asset
          if ("sha256:$((Get-FileHash $payload -Algorithm SHA256).Hash)" -ne $expected) { throw 'Release asset SHA-256 mismatch.' }
          "path=$payload" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Prepare Marketplace listing
        env:
          VS_MARKETPLACE_PUBLISHER: ${{ vars.VS_MARKETPLACE_PUBLISHER }}
        run: |
          if (!$env:VS_MARKETPLACE_PUBLISHER) {
              throw 'Set the VS_MARKETPLACE_PUBLISHER repository variable to the Marketplace publisher ID.'
          }
          $manifest = Join-Path $env:RUNNER_TEMP 'vs-publish.json'
          @{
              publisher = $env:VS_MARKETPLACE_PUBLISHER
              identity = @{ internalName = 'OrcaCodeNotes' }
              categories = @('coding')
              overview = (Resolve-Path 'docs/marketplace.md').Path
              assetFiles = @(
                  'add-note.png', 'preview.png', 'send-note.png' | ForEach-Object {
                      @{ pathOnDisk = (Resolve-Path "docs/$_").Path; targetPath = $_ }
                  }
              )
              private = $false
              repo = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          } | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath $manifest -Encoding utf8
      - name: Publish verified VSIX with OIDC
        uses: madskristensen/publish-marketplace@361d1d0c6107ce1ddcd331c9767ea0a4f9ec79d5 # v2.2.2
        with:
          extension-file: ${{ steps.installer.outputs.path }}
          publish-manifest-file: ${{ runner.temp }}/vs-publish.json
          oidc: 'true'
