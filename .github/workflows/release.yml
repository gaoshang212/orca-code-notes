name: Release VSIX

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vsix-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    runs-on: windows-2022
    outputs:
      asset: ${{ steps.stage.outputs.asset }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0
      - name: Build Release VSIX
        run: msbuild VsOrcaNotes.sln -restore -p:Configuration=Release -v:minimal -nologo
      - name: Test localized UI and outgoing notes
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/Localization.ps1
      - name: Check manifest and stage VSIX
        id: stage
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./.github/scripts/Stage-Vsix.ps1 -Tag $env:TAG
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: vsix
          path: dist/${{ steps.stage.outputs.asset }}
          if-no-files-found: error
          overwrite: true

  github-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: vsix
      - name: Publish versioned installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          if ! gh release view "$TAG" --json isDraft,assets > release.json; then
            gh release create "$TAG" "$ASSET" --verify-tag --title "Orca Code Notes $TAG" --generate-notes
          elif jq -e '.isDraft' release.json > /dev/null; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --draft=false
          else
            digest="sha256:$(sha256sum "$ASSET" | cut -d' ' -f1)"
            jq -e --arg name "$ASSET" --arg digest "$digest" \
              'any(.assets[]; .name == $name and .digest == $digest)' release.json > /dev/null || {
                echo "::error::The published release does not contain the matching VSIX."
                exit 1
              }
          fi

  marketplace:
    name: Publish Visual Studio Marketplace
    needs: [build, github-release]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: vsix
          path: dist
      - name: Install project version of VsixPublisher
        run: |
          [xml]$project = Get-Content -Raw OrcaNotes/OrcaNotes.csproj
          $version = ($project.Project.ItemGroup.PackageReference | Where-Object Include -eq 'Microsoft.VSSDK.BuildTools').Version
          nuget install Microsoft.VSSDK.BuildTools -Version $version -Source https://api.nuget.org/v3/index.json -OutputDirectory "$env:RUNNER_TEMP/tools" -ExcludeVersion -NonInteractive
      - name: Publish verified VSIX
        env:
          VS_MARKETPLACE_PUBLISHER: ${{ vars.VS_MARKETPLACE_PUBLISHER }}
          VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          if (!$env:VS_MARKETPLACE_PUBLISHER -or !$env:VS_MARKETPLACE_PAT) {
              throw 'Set the VS_MARKETPLACE_PUBLISHER repository variable and VS_MARKETPLACE_PAT repository secret.'
          }
          $publisher = Join-Path $env:RUNNER_TEMP 'tools/Microsoft.VSSDK.BuildTools/tools/vssdk/bin/lib/VsixPublisher.exe'
          $payload = (Resolve-Path "dist/$env:ASSET").Path
          $manifest = Join-Path $env:RUNNER_TEMP 'vs-publish.json'
          @{
              publisher = $env:VS_MARKETPLACE_PUBLISHER
              identity = @{ internalName = 'OrcaCodeNotes' }
              categories = @('coding')
              overview = (Resolve-Path 'docs/marketplace.md').Path
              private = $false
              repo = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          } | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath $manifest -Encoding utf8
          & $publisher publish -payload $payload -publishManifest $manifest -personalAccessToken $env:VS_MARKETPLACE_PAT
          exit $LASTEXITCODE
